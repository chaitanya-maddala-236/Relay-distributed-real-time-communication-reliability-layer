# WebSockets are long-lived; the defaults for a request/response proxy are
# wrong for them (Section 129). Three things matter here: the Upgrade
# handshake, read timeouts long enough to outlive an idle heartbeat
# interval, and no buffering of streamed frames.

events { worker_connections 8192; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream relay_nodes {
        # No sticky sessions on purpose: a client may land on any node and
        # resume its session there (Section 129). least_conn spreads
        # long-lived connections more evenly than round-robin.
        least_conn;
        server relay-node-1:8000 max_fails=3 fail_timeout=10s;
        server relay-node-2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /ws {
            proxy_pass http://relay_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Must exceed heartbeat_interval so an idle-but-healthy
            # connection is never cut by the proxy.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        location /v1/ {
            proxy_pass http://relay_nodes;
            proxy_set_header Host $host;
        }

        location /metrics {
            proxy_pass http://relay_nodes;
        }
    }
}
